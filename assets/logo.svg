<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 130" role="img" aria-label="Nahmani Ben-Dahan">
  <title>Nahmani Ben-Dahan</title>
  <!--
    מונוגרם NB, מצויר מחדש מתוך assets/brand/logo-reference.png.
    הקובץ המקורי הוא הדמיית חריטה בבטון ולא נכס; כאן הצורה בלבד.

    שני עקרונות שנשמרו מהמקור:
    1. ניגודיות עבה־דק בסגנון Didone - האלכסון של ה-N והגזע של ה-B עבים,
       הקווים האנכיים והסריפים דקים.
    2. הקו האנכי המשותף מתנשא מעל גובה האות ויורד מתחת לקו הבסיס.
       זה הפרט שמזהה את הלוגו, ואין לקצר אותו.

    fill מפורש ולא currentColor: כך הקובץ משמש גם כפאביקון עצמאי.
    בתוך העמוד הוא נטען כ-mask-image, ואז הצבע מגיע מ-CSS.
  -->
  <g fill="#2a2620">
    <!-- N: סריף עליון ותחתון של הגזע השמאלי -->
    <rect x="16" y="24" width="30" height="4"/>
    <rect x="16" y="100" width="30" height="4"/>
    <!-- N: גזע שמאלי דק -->
    <rect x="27.5" y="24" width="7" height="80"/>
    <!-- N: אלכסון עבה -->
    <path d="M27.5 24 L49 24 L93 104 L71.5 104 Z"/>

    <!-- הקו המשותף: גזע ימני של ה-N וגם שדרת ה-B.
         מתחיל מעל גובה האות ומסתיים מתחת לקו הבסיס. -->
    <rect x="93" y="9" width="4.6" height="112"/>

    <!-- B: גזע עבה -->
    <rect x="103" y="24" width="14.5" height="80"/>
    <rect x="97.6" y="24" width="24" height="4"/>
    <rect x="97.6" y="100" width="24" height="4"/>

    <!-- B: קערה עליונה. עבה בקשת הימנית, דקה בחיבורים. -->
    <path d="M117.5 24
             C 141 24 150 32 150 42.5
             C 150 53 141 61.5 117.5 61.5
             L 117.5 54.8
             C 133 54.8 136.6 49.5 136.6 42.5
             C 136.6 35.5 133 30.7 117.5 30.7 Z"/>

    <!-- B: קערה תחתונה, רחבה יותר מהעליונה כמקובל בסריף קלאסי. -->
    <path d="M117.5 61.5
             C 145 61.5 156 71 156 82.7
             C 156 94.5 145 104 117.5 104
             L 117.5 97.3
             C 138.5 97.3 142.3 90.8 142.3 82.7
             C 142.3 74.6 138.5 68.2 117.5 68.2 Z"/>
  </g>
</svg>
